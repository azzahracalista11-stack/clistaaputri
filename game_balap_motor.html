<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Motor Racing</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101827;color:#fff;font-family:system-ui,Arial,sans-serif;display:flex;justify-content:center;min-height:100vh;padding:18px}
.wrap{width:min(100%,460px)}h1{text-align:center;margin:5px 0 12px;font-size:25px}.stats{display:flex;justify-content:space-between;background:#1f2b40;padding:11px 13px;border-radius:12px;margin-bottom:10px;font-weight:800}
.game{height:min(68vh,590px);min-height:390px;position:relative;border:3px solid #566174;border-radius:15px;overflow:hidden;background:#43864a}
canvas{display:block;width:100%;height:100%;touch-action:none}
.overlay{position:absolute;inset:0;background:#07101dcc;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:25px}
.overlay h2{font-size:30px;margin:0 0 8px}.overlay p{line-height:1.5;margin:5px 0 20px}
button{border:0;border-radius:12px;padding:13px 9px;font-weight:850;font-size:15px;color:white;background:#2563eb;cursor:pointer;touch-action:manipulation}
button:active{transform:scale(.97)}.start{background:#16a34a;padding:13px 24px}.controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin-top:10px}.brake{background:#b7791f}.hint{text-align:center;color:#cbd5e1;font-size:12px;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
<h1>🏍️ MOTOR RACING</h1>
<div class="stats"><span id="score">Skor: 0</span><span id="speed">Kecepatan: 1x</span><span id="best">Best: 0</span></div>
<div class="game"><canvas id="gameCanvas"></canvas>
<div class="overlay" id="overlay"><div style="font-size:52px">🏁</div><h2 id="title">MOTOR RACING</h2><p id="desc">Hindari kendaraan, jangan sampai menabrak, dan kumpulkan skor tertinggi!</p><button class="start" id="start">▶ MULAI BALAP</button></div>
</div>
<div class="controls">
<button id="left">⬅ KIRI</button><button class="brake" id="brake">🐢 REM</button><button id="right">KANAN ➡</button>
</div>
<div class="hint">PC: tombol ← → atau A/D. HP: tahan tombol kiri/kanan. Hindari kendaraan!</div>
</div>
<script>
(() => {
 const canvas=document.getElementById('gameCanvas'),ctx=canvas.getContext('2d');
 const $=id=>document.getElementById(id);
 let W=360,H=500,playing=false,score=0,best=0,playerX=0,traffic=[],roadOffset=0,spawnTimer=0,lastTime=0,speed=1,keys={left:false,right:false,brake:false},raf=0;
 function resize(){
   const r=canvas.getBoundingClientRect(),dpr=Math.min(window.devicePixelRatio||1,2);
   W=Math.max(280,r.width);H=Math.max(360,r.height);
   canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);
   ctx.setTransform(dpr,0,0,dpr,0,0);
   draw();
 }
 function road(){const rw=W*.64,laneLeft=(W-rw)/2;return {rw,laneLeft,laneRight:laneLeft+rw,laneW:rw/3};}
 function rounded(x,y,w,h,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill();}
 function bike(x,y,color,scale=1){
   ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);
   // wheels and bike body
   ctx.fillStyle='#111';ctx.beginPath();ctx.ellipse(0,12,8,13,0,0,Math.PI*2);ctx.fill();
   ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(-10,6);ctx.lineTo(-7,-9);ctx.lineTo(0,-16);ctx.lineTo(8,-8);ctx.lineTo(10,7);ctx.lineTo(4,11);ctx.lineTo(-5,11);ctx.closePath();ctx.fill();
   rounded(-5,-14,10,8,3,'#f8fafc');rounded(-7,3,14,5,2,'#222');
   ctx.fillStyle='#f3c9a3';ctx.beginPath();ctx.arc(0,-22,7,0,Math.PI*2);ctx.fill();
   rounded(-7,-28,14,7,3,'#111827');ctx.restore();
 }
 function car(x,y,color){
   ctx.save();ctx.translate(x,y);
   rounded(-14,-24,28,48,7,color);rounded(-10,-15,20,13,3,'#bde7f7');rounded(-10,3,20,10,3,'#c8eafa');
   rounded(-17,-15,4,11,2,'#111');rounded(13,-15,4,11,2,'#111');rounded(-17,10,4,11,2,'#111');rounded(13,10,4,11,2,'#111');
   rounded(-9,-23,6,4,1,'#fff3b0');rounded(3,-23,6,4,1,'#fff3b0');ctx.restore();
 }
 function draw(){
   if(!ctx)return;
   ctx.clearRect(0,0,W,H);
   ctx.fillStyle='#43864a';ctx.fillRect(0,0,W,H);
   const {rw,laneLeft,laneRight,laneW}=road();
   // grass stripes
   ctx.fillStyle='#367740';for(let y=-(roadOffset%70);y<H;y+=70){ctx.fillRect(0,y,Math.max(0,laneLeft-5),32);ctx.fillRect(laneRight+5,y,W-laneRight,32);}
   ctx.fillStyle='#414751';ctx.fillRect(laneLeft,0,rw,H);
   ctx.fillStyle='#f8fafc';ctx.fillRect(laneLeft,0,4,H);ctx.fillRect(laneRight-4,0,4,H);
   // dashed lane markings
   ctx.fillStyle='#e5e7eb';for(let lane=1;lane<3;lane++){let x=laneLeft+lane*laneW-2;for(let y=-(roadOffset%58);y<H;y+=58)ctx.fillRect(x,y,4,30);}
   traffic.forEach(t=>{if(t.type==='car')car(t.x,t.y,t.color);else bike(t.x,t.y,t.color,.9);});
   bike(laneLeft+playerX*rw,H-76,'#ef4444',1.12);
 }
 function update(dt){
   const {rw,laneLeft,laneW}=road();
   speed=keys.brake?.65:1;
   if(keys.left)playerX-=dt*.00135*speed;
   if(keys.right)playerX+=dt*.00135*speed;
   playerX=Math.max(-.29,Math.min(.29,playerX));
   roadOffset+=dt*.22*speed;
   score+=dt*.012*speed;
   spawnTimer+=dt;
   if(spawnTimer>Math.max(430,1000-score*1.4)){
     spawnTimer=0;
     let lane=Math.floor(Math.random()*3);
     // Try to avoid creating a car directly on top of another
     let x=laneLeft+laneW*(lane+.5);
     traffic.push({x,y:-40,type:Math.random()<.72?'car':'bike',color:['#38bdf8','#facc15','#a78bfa','#fb923c','#f472b6'][Math.floor(Math.random()*5)],v:(.19+Math.random()*.11)*speed});
   }
   for(const t of traffic)t.y+=dt*(.20+t.v)*speed;
   traffic=traffic.filter(t=>t.y<H+55);
   const px=laneLeft+playerX*rw,py=H-76;
   for(const t of traffic){
     if(Math.abs(t.x-px)<23&&Math.abs(t.y-py)<34){gameOver();return;}
   }
   $('score').textContent='Skor: '+Math.floor(score);
   $('speed').textContent='Kecepatan: '+(1+Math.floor(score/100)*.2).toFixed(1)+'x';
   draw();
 }
 function frame(now){if(!playing)return;let dt=Math.min(now-lastTime,40)||16;lastTime=now;update(dt);if(playing)raf=requestAnimationFrame(frame);}
 function start(){
   cancelAnimationFrame(raf);playing=true;score=0;playerX=0;traffic=[];roadOffset=0;spawnTimer=0;lastTime=performance.now();
   keys={left:false,right:false,brake:false};$('overlay').style.display='none';$('start').textContent='▶ MAIN LAGI';
   raf=requestAnimationFrame(frame);
 }
 function gameOver(){
   playing=false;cancelAnimationFrame(raf);best=Math.max(best,Math.floor(score));
   $('best').textContent='Best: '+best;$('title').textContent='💥 GAME OVER';$('desc').textContent='Skor kamu: '+Math.floor(score)+'. Hindari kendaraan dan coba pecahkan rekor!';$('start').textContent='↻ COBA LAGI';$('overlay').style.display='flex';draw();
 }
 function bindHold(id,key){
   const el=$(id);
   const down=e=>{e.preventDefault();keys[key]=true;};
   const up=e=>{e.preventDefault();keys[key]=false;};
   el.addEventListener('pointerdown',down);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);el.addEventListener('pointerleave',up);
 }
 bindHold('left','left');bindHold('right','right');bindHold('brake','brake');
 window.addEventListener('keydown',e=>{if(['ArrowLeft','a','A'].includes(e.key)){keys.left=true;e.preventDefault();}if(['ArrowRight','d','D'].includes(e.key)){keys.right=true;e.preventDefault();}if(['ArrowDown',' '].includes(e.key)){keys.brake=true;e.preventDefault();}if(e.key==='Enter'&&!playing)start();});
 window.addEventListener('keyup',e=>{if(['ArrowLeft','a','A'].includes(e.key))keys.left=false;if(['ArrowRight','d','D'].includes(e.key))keys.right=false;if(['ArrowDown',' '].includes(e.key))keys.brake=false;});
 $('start').addEventListener('click',start);window.addEventListener('resize',resize);
 resize();
})();
</script>
</body>
</html>
